<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Charity Chepkirui | Contact</title><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"/><link rel="stylesheet" href="assets/css/midnight-theme.css?v=20260902-2"/><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></head><body><nav><div class="logo"><img src="assets/images/charity-logo.svg" alt="Charity Chepkirui" class="logo-img"></div><ul><li><a href="index.html">Home</a></li><li><a href="resume.html">About</a></li><li><a href="services.html">Services</a></li><li><a href="projects.html">Projects</a></li><li><a href="blog.html">Blog</a></li><li><a href="contact.html" class="active">Contact</a></li></ul></nav><main class="page-container contact-page"><div class="contact-wrapper"><h1>Start a Project</h1><p>Have a project in mind? Tell me what you need and I’ll review your requirements and get back to you.</p><form id="contactForm" action="https://formspree.io/f/mjkenlzj" method="POST" class="contact-form"><input type="text" name="name" placeholder="Your Name" required><input type="email" name="_replyto" placeholder="Your Email" required><input type="text" name="company" placeholder="Company / Organization (optional)"><select name="service" required><option value="" disabled selected>What service do you need?</option><option>Cybersecurity</option><option>Data Annotation & AI Training</option><option>Data Analytics</option><option>Graphic Design</option><option>Web Design & Development</option><option>Other / Not sure</option></select><input type="text" name="timeline" placeholder="Preferred timeline (optional)"><textarea name="message" rows="6" placeholder="Tell me about your project, requirements and goals..." required></textarea><button type="submit"><i class="fas fa-paper-plane"></i> Send Project Inquiry</button><p id="form-status" class="form-status"></p></form><div class="social-links"><a href="mailto:chepkiruicharity63@gmail.com" aria-label="Email"><i class="fas fa-envelope"></i></a><a href="https://linkedin.com/in/charity-chepkirui" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a><a href="https://github.com/charykui" target="_blank" rel="noopener" aria-label="GitHub"><i class="fab fa-github"></i></a></div></div></main><footer><p>&copy; 2025 Charity Chepkirui | Professional Portfolio</p></footer><div id="popup-message" class="popup-message"></div><script>const form=document.getElementById("contactForm"),popup=document.getElementById("popup-message");form.addEventListener("submit",async e=>{e.preventDefault();try{const r=await fetch(form.action,{method:form.method,body:new FormData(form),headers:{Accept:"application/json"}});showPopup(r.ok?"✅ Thank you! Your project inquiry has been received. I’ll get back to you promptly.":"❌ Oops! Something went wrong. Please try again.",!r.ok);if(r.ok)form.reset()}catch(error){showPopup("❌ Network error. Please check your connection and try again.",true)}});function showPopup(m,e){popup.textContent=m;popup.className="popup-message"+(e?" error":"");popup.style.display="block";setTimeout(()=>popup.style.opacity="1",50);setTimeout(()=>{popup.style.opacity="0";setTimeout(()=>popup.style.display="none",500)},4500)}</script></body></html>
