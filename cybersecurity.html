<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Charity Chepkirui | Cyber & Cloud Security</title><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"/><link rel="stylesheet" href="assets/css/work.css"/><link rel="stylesheet" href="assets/css/midnight-theme.css"/><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></head><body><nav><div class="logo"><img src="assets/images/logo.png" alt="Logo" class="logo-img"></div><ul><li><a href="index.html">Home</a></li><li><a href="resume.html">Resume</a></li><li><a href="projects.html" class="active">Projects</a></li><li><a href="blog.html">Blog</a></li><li><a href="contact.html">Contact</a></li></ul></nav><main><div class="back-to-work"><a href="projects.html">← Back to My Work</a></div><h1 class="page-title">Cybersecurity Projects & Labs</h1><div class="tabs" id="tabs-container"></div><div id="tab-contents"></div></main><footer><p>&copy; 2025 Charity Chepkirui | Cybersecurity Portfolio</p></footer><script>async function loadProjects(){try{const r=await fetch("assets/data/projects-main.json"),d=await r.json(),t=document.getElementById("tabs-container"),c=document.getElementById("tab-contents");let f=true;for(const[k,p]of Object.entries(d)){const id=k.replace(/\s+/g,"-").toLowerCase(),b=document.createElement("button");b.className="tab-btn"+(f?" active":"");b.dataset.tab=id;b.textContent=k;t.appendChild(b);const x=document.createElement("div");x.id=id;x.className="tab-content"+(f?" active":"");const g=document.createElement("div");g.className="mini-card-grid";p.forEach(q=>{const a=document.createElement("div");a.className="mini-card";a.innerHTML=`<h3>${q.title}</h3><p>${q.description}</p><a href="project-detail.html?file=${q.jsonFile}" class="view-link">View Details →</a>`;g.appendChild(a)});x.appendChild(g);c.appendChild(x);f=false}document.querySelectorAll(".tab-btn").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab-btn").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".tab-content").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById(b.dataset.tab).classList.add("active")})}catch(e){console.error(e)}}loadProjects()</script></body></html>
