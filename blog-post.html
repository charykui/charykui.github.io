<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Charity Chepkirui | Blog</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/midnight-theme.css?v=20260829-3" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon.png">
</head>
<body>
  <nav><div class="logo"><img src="assets/images/charity-logo.svg" alt="Charity Chepkirui" class="logo-img"></div><ul><li><a href="index.html">Home</a></li><li><a href="resume.html">Resume</a></li><li><a href="projects.html">Projects</a></li><li><a href="blog.html" class="active">Blog</a></li><li><a href="contact.html">Contact</a></li></ul></nav>
  <main class="page-container blog-post-page"><a href="blog.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Blog</a><article id="blogPostContent" class="blog-post-wrapper"></article></main>
  <footer><p>&copy; 2025 Charity Chepkirui | Professional Portfolio</p></footer>
  <script>const params=new URLSearchParams(window.location.search),postId=params.get("id");fetch(`assets/data/posts/${postId}.json`).then(response=>response.json()).then(post=>{document.getElementById("blogPostContent").innerHTML=`<h1>${post.title}</h1><p class="blog-date"><i class="fas fa-calendar-alt"></i> ${post.date}</p>${post.image?`<img src="${post.image}" alt="${post.title}" class="blog-post-img">`:""}<div class="blog-content">${post.content}</div>`}).catch(error=>{console.error("Error loading blog post:",error);document.getElementById("blogPostContent").innerHTML="<p>Post not found.</p>"});</script>
</body></html>
